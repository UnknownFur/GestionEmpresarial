<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="initial-scale=1.0, width=device-width" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }
  </style>

  <!-- Tu API KEY va aquí -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBw6Ktt-rw12jLhpJpkd3evPUYhu0YkZZM&libraries=geometry&callback=initMap" async defer></script>

  <script>
    var map;
    var userMarker;
    var poiMarkers = [];

  function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
          zoom: 15,
          center: { lat: 4.7110, lng: -74.0721 } // Bogotá por defecto
      });

      // Avisar a Unity que el mapa ya está listo
      if (typeof unity !== "undefined" && unity) {
          unity.SendMessage("MapLoader", "OnMapReady");
      }
  }

    // Llamado desde Unity → actualiza posición del usuario
    function updateUserPosition(lat, lon) {
      console.log("📍 Nueva posición: " + lat + ", " + lon);
      if (!map) return;

      var pos = new google.maps.LatLng(lat, lon);

      if (!userMarker) {
        userMarker = new google.maps.Marker({
          position: pos,
          map: map,
          title: "Tu ubicación",
          icon: { url: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png" }
        });
      } else {
        userMarker.setPosition(pos);
      }

      map.setCenter(pos);
    }

    // Llamado desde Unity → agrega un POI
    function addPOI(lat, lon, title) {
      var marker = new google.maps.Marker({
        position: { lat: lat, lng: lon },
        map: map,
        title: title,
        icon: { url: "http://maps.google.com/mapfiles/ms/icons/red-dot.png" }
      });

      poiMarkers.push(marker);
    }
  </script>
</head>
<body>
  <div id="map"></div>
</body>
</html>
