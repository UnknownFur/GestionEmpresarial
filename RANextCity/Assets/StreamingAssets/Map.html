<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="initial-scale=1.0, width=device-width" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }
  </style>

  <!-- API KEY -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBw6Ktt-rw12jLhpJpkd3evPUYhu0YkZZM&libraries=geometry"></script>

  <script>
    var map;
    var userMarker;
    var poiMarkers = [];
    var directionsService;
    var directionsRenderer;
    var lastUserPos = null;

  function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
      zoom: 15,
      center: { lat: 4.7110, lng: -74.0721 }, // Bogotá
      styles: [
        { elementType: "geometry", stylers: [{ color: "#212121" }] },
        { elementType: "labels.icon", stylers: [{ visibility: "off" }] },
        { elementType: "labels.text.fill", stylers: [{ color: "#757575" }] },
        { elementType: "labels.text.stroke", stylers: [{ color: "#212121" }] },
        {
          featureType: "administrative",
          elementType: "geometry",
          stylers: [{ color: "#757575" }]
        },
        {
          featureType: "administrative.country",
          elementType: "labels.text.fill",
          stylers: [{ color: "#9e9e9e" }]
        },
        {
          featureType: "administrative.land_parcel",
          stylers: [{ visibility: "off" }]
        },
        {
          featureType: "administrative.locality",
          elementType: "labels.text.fill",
          stylers: [{ color: "#bdbdbd" }]
        },
        {
          featureType: "poi",
          elementType: "labels.text.fill",
          stylers: [{ color: "#757575" }]
        },
        {
          featureType: "poi.park",
          elementType: "geometry",
          stylers: [{ color: "#181818" }]
        },
        {
          featureType: "poi.park",
          elementType: "labels.text.fill",
          stylers: [{ color: "#616161" }]
        },
        {
          featureType: "poi.park",
          elementType: "labels.text.stroke",
          stylers: [{ color: "#1b1b1b" }]
        },
        {
          featureType: "road",
          elementType: "geometry.fill",
          stylers: [{ color: "#2c2c2c" }]
        },
        {
          featureType: "road",
          elementType: "labels.text.fill",
          stylers: [{ color: "#8a8a8a" }]
        },
        {
          featureType: "road.arterial",
          elementType: "geometry",
          stylers: [{ color: "#373737" }]
        },
        {
          featureType: "road.highway",
          elementType: "geometry",
          stylers: [{ color: "#3c3c3c" }]
        },
        {
          featureType: "road.highway.controlled_access",
          elementType: "geometry",
          stylers: [{ color: "#4e4e4e" }]
        },
        {
          featureType: "road.local",
          elementType: "labels.text.fill",
          stylers: [{ color: "#616161" }]
        },
        {
          featureType: "transit",
          elementType: "labels.text.fill",
          stylers: [{ color: "#757575" }]
        },
        {
          featureType: "water",
          elementType: "geometry",
          stylers: [{ color: "#000000" }]
        },
        {
          featureType: "water",
          elementType: "labels.text.fill",
          stylers: [{ color: "#3d3d3d" }]
        }
      ]
    });

    directionsService = new google.maps.DirectionsService();
    directionsRenderer = new google.maps.DirectionsRenderer({
      map: map,
      suppressMarkers: false
    });

    // Simular ubicación inicial del usuario
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(position) {
        updateUserPosition(position.coords.latitude, position.coords.longitude);
      }, function(error) {
        console.error("❌ Error obteniendo ubicación:", error);
        // fallback a coordenadas simuladas
        updateUserPosition(4.7112, -74.0720);
      });
    } else {
      console.warn("❌ Geolocation no soportada, usando ubicación simulada");
      updateUserPosition(4.7112, -74.0720);
    }

    // ✅ Avisar a Unity que el mapa está listo
    unityReady();
  }

    function addPOI(lat, lon, title) {
      var marker = new google.maps.Marker({
        position: { lat: lat, lng: lon },
        map: map,
        title: title,
        icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
      });
      poiMarkers.push(marker);
    }

    function updateUserPosition(lat, lon) {
      console.log("📍 Nueva posición: " + lat + ", " + lon);
      if (!map) return;

      var pos = new google.maps.LatLng(lat, lon);

      if (!userMarker) {
        userMarker = new google.maps.Marker({
          position: pos,
          map: map,
          title: "Tu ubicación",
          icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
        });
      } else {
        userMarker.setPosition(pos);
      }

      map.panTo(pos);

      // solo recalcular ruta si se movió > 5m
      if (!lastUserPos || google.maps.geometry.spherical.computeDistanceBetween(pos, lastUserPos) > 5) {
        showRouteToClosestPOI();
        lastUserPos = pos;
      }
    }

    function showRouteToClosestPOI() {
      if (!userMarker || poiMarkers.length === 0) return;

      let userPos = userMarker.getPosition(); // LatLng válido
      let closest = poiMarkers[0];
      let minDist = google.maps.geometry.spherical.computeDistanceBetween(userPos, closest.getPosition());

      for (let i = 1; i < poiMarkers.length; i++) {
        let dist = google.maps.geometry.spherical.computeDistanceBetween(userPos, poiMarkers[i].getPosition());
        if (dist < minDist) {
          minDist = dist;
          closest = poiMarkers[i];
        }
      }

      // ✅ convertir a objetos {lat, lng}
      let origin = { lat: userPos.lat(), lng: userPos.lng() };
      let destination = { 
        lat: closest.getPosition().lat(), 
        lng: closest.getPosition().lng() 
      };

      directionsService.route(
        {
          origin: origin,
          destination: destination,
          travelMode: google.maps.TravelMode.WALKING
        },
        function(result, status) {
          console.log("Ruta status:", status);
          if (status === "OK") {
            directionsRenderer.setDirections(result);
          } else {
            console.warn("❌ No se pudo calcular ruta: " + status);
          }
        }
      );
    }

    // 🔹 Avisar a Unity que el mapa ya está cargado
    function unityReady() {
      if (window.Unity) {
        Unity.call("map_ready");
      }
    }

    // ✅ Llamar a initMap cuando cargue la página
    window.onload = initMap;
  </script>
</head>
<body>
  <div id="map"></div>
</body>
</html>
