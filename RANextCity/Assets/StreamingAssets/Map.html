<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="initial-scale=1.0, width=device-width" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }
  </style>

  <!-- API KEY -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBw6Ktt-rw12jLhpJpkd3evPUYhu0YkZZM&libraries=geometry"></script>

  <script>
    var map;
    var userMarker;
    var poiMarkers = [];
    var directionsService;
    var directionsRenderer;
    var lastUserPos = null;
    var distanceDiv;       // 📏 Mostrar distancia
    var nearPOISent = false; // ⚙️ Para no repetir notificación a Unity

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 15,
        center: { lat: 4.7110, lng: -74.0721 }, // Bogotá
        disableDefaultUI: true,
        zoomControl: false,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
        gestureHandling: "greedy",
        styles: [
          { elementType: "geometry", stylers: [{ color: "#212121" }] },
          { elementType: "labels.icon", stylers: [{ visibility: "off" }] },
          { elementType: "labels.text.fill", stylers: [{ color: "#757575" }] },
          { elementType: "labels.text.stroke", stylers: [{ color: "#212121" }] },
          { featureType: "administrative", elementType: "geometry", stylers: [{ color: "#757575" }] },
          { featureType: "administrative.country", elementType: "labels.text.fill", stylers: [{ color: "#9e9e9e" }] },
          { featureType: "administrative.land_parcel", stylers: [{ visibility: "off" }] },
          { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#bdbdbd" }] },
          { featureType: "poi", elementType: "labels.text.fill", stylers: [{ color: "#757575" }] },
          { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#181818" }] },
          { featureType: "poi.park", elementType: "labels.text.fill", stylers: [{ color: "#616161" }] },
          { featureType: "poi.park", elementType: "labels.text.stroke", stylers: [{ color: "#1b1b1b" }] },
          { featureType: "road", elementType: "geometry.fill", stylers: [{ color: "#2c2c2c" }] },
          { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#8a8a8a" }] },
          { featureType: "road.arterial", elementType: "geometry", stylers: [{ color: "#373737" }] },
          { featureType: "road.highway", elementType: "geometry", stylers: [{ color: "#3c3c3c" }] },
          { featureType: "road.highway.controlled_access", elementType: "geometry", stylers: [{ color: "#4e4e4e" }] },
          { featureType: "road.local", elementType: "labels.text.fill", stylers: [{ color: "#616161" }] },
          { featureType: "transit", elementType: "labels.text.fill", stylers: [{ color: "#757575" }] },
          { featureType: "water", elementType: "geometry", stylers: [{ color: "#000000" }] },
          { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#3d3d3d" }] }
        ]
      });

      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({
        map: map,
        suppressMarkers: false,
        preserveViewport: true
      });

      // 📏 Elemento visual de distancia
      distanceDiv = document.createElement("div");
      distanceDiv.style.position = "absolute";
      distanceDiv.style.bottom = "10px";
      distanceDiv.style.left = "50%";
      distanceDiv.style.transform = "translateX(-50%)";
      distanceDiv.style.background = "rgba(0,0,0,0.6)";
      distanceDiv.style.color = "white";
      distanceDiv.style.padding = "6px 12px";
      distanceDiv.style.borderRadius = "12px";
      distanceDiv.style.fontFamily = "sans-serif";
      distanceDiv.style.fontSize = "14px";
      distanceDiv.style.zIndex = "9999";
      distanceDiv.innerText = "📍 Calculando distancia...";
      document.body.appendChild(distanceDiv);

      // 🛰️ Obtener ubicación del usuario
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => updateUserPosition(pos.coords.latitude, pos.coords.longitude),
          (error) => {
            console.error("❌ Error obteniendo ubicación:", error);
            updateUserPosition(4.7112, -74.0720);
          }
        );
      } else {
        console.warn("❌ Geolocation no soportada, usando ubicación simulada");
        updateUserPosition(4.7112, -74.0720);
      }

      // ✅ Avisar a Unity que el mapa está listo
      unityReady();
    }

    // 🧭 Agregar puntos de interés
    function addPOI(lat, lon, title) {
      var marker = new google.maps.Marker({
        position: { lat: lat, lng: lon },
        map: map,
        title: title,
        icon: "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
      });
      poiMarkers.push(marker);
    }

    // 📍 Actualizar la posición del usuario
    function updateUserPosition(lat, lon) {
      var pos = new google.maps.LatLng(lat, lon);
      if (!map) return;

      if (!userMarker) {
        userMarker = new google.maps.Marker({
          position: pos,
          map: map,
          title: "Tu ubicación",
          icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
        });
      } else {
        userMarker.setPosition(pos);
      }

      map.panTo(pos);

      if (!lastUserPos || google.maps.geometry.spherical.computeDistanceBetween(pos, lastUserPos) > 3) {
        lastUserPos = pos;
        showRouteToClosestPOI();
        updateDistanceToClosestPOI();
      }
    }

    // 🚶‍♂️ Mostrar ruta al POI más cercano
    function showRouteToClosestPOI() {
      if (!userMarker || poiMarkers.length === 0) return;

      let userPos = userMarker.getPosition();
      let closest = poiMarkers[0];
      let minDist = google.maps.geometry.spherical.computeDistanceBetween(userPos, closest.getPosition());

      for (let i = 1; i < poiMarkers.length; i++) {
        let dist = google.maps.geometry.spherical.computeDistanceBetween(userPos, poiMarkers[i].getPosition());
        if (dist < minDist) {
          minDist = dist;
          closest = poiMarkers[i];
        }
      }

      let origin = { lat: userPos.lat(), lng: userPos.lng() };
      let destination = { lat: closest.getPosition().lat(), lng: closest.getPosition().lng() };

      directionsService.route(
        {
          origin: origin,
          destination: destination,
          travelMode: google.maps.TravelMode.WALKING
        },
        function(result, status) {
          if (status === "OK") {
            directionsRenderer.setDirections(result);
          } else {
            console.warn("❌ No se pudo calcular ruta:", status);
          }
        }
      );
    }

    // 📏 Calcular distancia al POI más cercano y avisar a Unity
    function updateDistanceToClosestPOI() {
      if (!userMarker || poiMarkers.length === 0) return;

      let userPos = userMarker.getPosition();
      let closest = poiMarkers[0];
      let minDist = google.maps.geometry.spherical.computeDistanceBetween(userPos, closest.getPosition());

      for (let i = 1; i < poiMarkers.length; i++) {
        let dist = google.maps.geometry.spherical.computeDistanceBetween(userPos, poiMarkers[i].getPosition());
        if (dist < minDist) {
          minDist = dist;
          closest = poiMarkers[i];
        }
      }

      distanceDiv.innerText = `📏 Estás a ${minDist.toFixed(1)} m del punto de interés`;

      if (minDist < 20 && !nearPOISent) {
        nearPOISent = true;
        console.log("🎯 Dentro del rango del POI:", minDist.toFixed(1), "m");
        if (window.Unity && typeof Unity.call === "function") {
          Unity.call("near_poi");
        }
      }

      // Si se aleja, volver a permitir activación
      if (minDist > 30 && nearPOISent) {
        nearPOISent = false;
      }
    }

    // 🔔 Confirmar a Unity que el mapa está listo
    function unityReady() {
      if (window.Unity && typeof Unity.call === "function") {
        Unity.call("map_ready");
      } else {
        console.warn("⚠️ Unity no detectado aún, reintentando...");
        setTimeout(unityReady, 1000);
      }
    }

    window.onload = initMap;
  </script>
</head>
<body>
  <div id="map"></div>
</body>
</html>
